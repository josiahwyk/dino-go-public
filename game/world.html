<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dino World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Dino World: a separate game from Dino Go (index.html). Same look and colours, its own page. World code is in overworld.js. */
:root{
  --sky:#CDEBF5; --leaf:#2F6B3A; --fern:#9FD08A; --ink:#1E2B1F; --line:#1E2B1F22;
  --display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --body:"Andika","Comic Neue",ui-rounded,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--sky) 0%,#E4F4E0 55%,var(--fern) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--body);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
#app{max-width:980px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--display);font-weight:800;color:var(--leaf);margin:0;text-align:center;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.05}
.w-view{flex:1;min-height:0;position:relative}
.pad{--b:clamp(64px,17vw,84px);flex:none;display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(3,var(--b));gap:6px;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0px);touch-action:none}
.pad button{border:0;border-radius:20px;background:var(--leaf);color:#fff;box-shadow:0 5px 0 #1C4224;display:grid;place-items:center;padding:0;
  cursor:pointer;touch-action:none;-webkit-touch-callout:none}
.pad button.on{transform:translateY(3px);box-shadow:0 2px 0 #1C4224;background:#3A8247}
.pad svg{width:46%;height:46%;fill:currentColor}
.pad [data-dir=up]{grid-area:1/2}.pad [data-dir=left]{grid-area:2/1}.pad [data-dir=right]{grid-area:2/3}.pad [data-dir=down]{grid-area:3/2}
#w-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:18px;box-shadow:0 6px 0 var(--line);image-rendering:pixelated;background:#7CC46A}
</style>

<div id="app">
  <h1>Dino World</h1>
  <div class="w-view" id="w-view"><canvas id="w-canvas" aria-label="Map of the dino world"></canvas></div>
  <div class="pad" id="w-pad" aria-label="Walk">
    <button data-dir="up" aria-label="Walk up"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8H1z" transform="rotate(0 5 5)"/></svg></button>
    <button data-dir="left" aria-label="Walk left"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8H1z" transform="rotate(270 5 5)"/></svg></button>
    <button data-dir="right" aria-label="Walk right"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8H1z" transform="rotate(90 5 5)"/></svg></button>
    <button data-dir="down" aria-label="Walk down"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5 9 8H1z" transform="rotate(180 5 5)"/></svg></button>
  </div>
</div>

<script src="overworld.js"></script>
